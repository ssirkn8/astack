name: Release proposal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-proposal-main
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main' && vars.RELEASE_PROPOSALS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Require a configured proposal App
        env:
          APP_ID: ${{ vars.RELEASE_PROPOSAL_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_PROPOSAL_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo 'Configure the repository-scoped proposal App or keep proposals disabled and use manual release preparation.' >&2
            exit 1
          fi
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_PROPOSAL_APP_ID }}
          private-key: ${{ secrets.RELEASE_PROPOSAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: Require the published baseline and exclusive preparation
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: uv run --locked python scripts/check_release_proposal.py
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
